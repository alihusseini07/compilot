apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-scraper
  namespace: default
spec:
  # Every 6 hours
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: github-scraper
              image: your-registry/compint-backend:latest
              command:
                - python
                - -c
                - |
                  import asyncio, os
                  from agents.github_agent import GitHubAgent
                  companies = os.environ.get("TRACKED_COMPANIES", "linear").split(",")
                  async def main():
                      agent = GitHubAgent()
                      for c in companies:
                          await agent.run(c.strip())
                  asyncio.run(main())
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: compint-secrets
                      key: DATABASE_URL
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: compint-secrets
                      key: GITHUB_TOKEN
                - name: TRACKED_COMPANIES
                  value: "linear,notion,figma"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
