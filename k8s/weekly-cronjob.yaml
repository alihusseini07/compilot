apiVersion: batch/v1
kind: CronJob
metadata:
  name: compilot-weekly
  namespace: default
spec:
  # Mondays at 00:00 UTC — WeeklySynthesisAgent reads 7 daily reports
  # (or falls back to direct scrape with last_7_days).
  schedule: "0 0 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: orchestrator
              image: ahusseini07/compilot-backend:latest
              command:
                - python
                - -c
                - |
                  import asyncio, os
                  from agents.orchestrator import run
                  companies = os.environ.get("TRACKED_COMPANIES", "linear").split(",")
                  async def main():
                      for c in companies:
                          try:
                              await run(c.strip(), "weekly")
                          except Exception as e:
                              print(f"[weekly-cronjob] failed for {c.strip()}: {e}")
                  asyncio.run(main())
              env:
                - name: OLLAMA_HOST
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: OLLAMA_HOST
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: REDIS_URL
                - name: OLLAMA_MODEL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: OLLAMA_MODEL
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: GITHUB_TOKEN
                      optional: true
                - name: LENS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: LENS_API_TOKEN
                      optional: true
                - name: TRACKED_COMPANIES
                  value: "linear,notion,figma"
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
