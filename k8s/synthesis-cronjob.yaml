apiVersion: batch/v1
kind: CronJob
metadata:
  name: synthesis-agent
  namespace: default
spec:
  # Run nightly at midnight UTC
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: synthesis
              image: ahusseini07/compilot-backend:latest
              # Run synthesis for all tracked companies. Extend this list as needed.
              command:
                - python
                - -c
                - |
                  import asyncio, os
                  from agents.synthesis_agent import SynthesisAgent
                  companies = os.environ.get("TRACKED_COMPANIES", "linear").split(",")
                  async def main():
                      agent = SynthesisAgent()
                      for c in companies:
                          await agent.run(c.strip())
                  asyncio.run(main())
              env:
                - name: OLLAMA_HOST
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: OLLAMA_HOST
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: REDIS_URL
                - name: OLLAMA_MODEL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: OLLAMA_MODEL
                - name: TRACKED_COMPANIES
                  value: "linear,notion,figma"
              resources:
                # Sized for vc2-2c-4gb Vultr node (2 vCPU, 4 GB RAM)
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
