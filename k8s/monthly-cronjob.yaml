apiVersion: batch/v1
kind: CronJob
metadata:
  name: compilot-monthly
  namespace: default
spec:
  # 1st of each month at 00:00 UTC — MonthlySynthesisAgent reads 4 weekly reports.
  schedule: "0 0 1 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: orchestrator
              image: ahusseini07/compilot-backend:latest
              command:
                - python
                - -c
                - |
                  import asyncio, os
                  from agents.orchestrator import run
                  companies = os.environ.get("TRACKED_COMPANIES", "linear").split(",")
                  async def main():
                      for c in companies:
                          try:
                              await run(c.strip(), "monthly")
                          except Exception as e:
                              print(f"[monthly-cronjob] failed for {c.strip()}: {e}")
                  asyncio.run(main())
              envFrom:
                - configMapRef:
                    name: compilot-config
              env:
                - name: INFERENCE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: INFERENCE_API_KEY
                - name: INFERENCE_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: INFERENCE_BASE_URL
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: DATABASE_URL
                - name: REDIS_URL
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: REDIS_URL
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: GITHUB_TOKEN
                      optional: true
                - name: LENS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: compilot-secrets
                      key: LENS_API_TOKEN
                      optional: true
                - name: TRACKED_COMPANIES
                  value: "linear,notion,figma"
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
