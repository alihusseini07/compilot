apiVersion: apps/v1
kind: Deployment
metadata:
  name: compilot-celery-worker
  namespace: default
  labels:
    app: compilot-celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compilot-celery-worker
  template:
    metadata:
      labels:
        app: compilot-celery-worker
    spec:
      containers:
        - name: worker
          image: ahusseini07/compilot-backend:latest
          command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: compilot-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compilot-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compilot-secrets
                  key: REDIS_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compilot-secrets
                  key: GITHUB_TOKEN
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef:
                  name: compilot-secrets
                  key: OLLAMA_HOST
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
