apiVersion: apps/v1
kind: Deployment
metadata:
  name: compint-backend
  namespace: default
  labels:
    app: compint-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compint-backend
  template:
    metadata:
      labels:
        app: compint-backend
    spec:
      containers:
        - name: backend
          image: your-registry/compint-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: compint-config
          env:
            - name: VULTR_INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compint-secrets
                  key: VULTR_INFERENCE_API_KEY
            - name: VULTR_INFERENCE_URL
              valueFrom:
                secretKeyRef:
                  name: compint-secrets
                  key: VULTR_INFERENCE_URL
            - name: OLLAMA_URL
              valueFrom:
                secretKeyRef:
                  name: compint-secrets
                  key: OLLAMA_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: compint-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: compint-secrets
                  key: REDIS_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: compint-secrets
                  key: GITHUB_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: compint-backend
  namespace: default
spec:
  selector:
    app: compint-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
